<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 - 用户端</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { overflow: hidden; }
  .user-app { display: flex; height: 100vh; }
  .user-sidebar {
    width: 260px;
    background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
    color: #c7d2fe;
    display: flex;
    flex-direction: column;
  }
  .user-sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .user-sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
  }
  .user-sidebar-header .logo-icon { font-size: 24px; }
  .user-sidebar-header .logo-text { font-size: 16px; font-weight: 600; }
  .user-session-list { flex: 1; overflow-y: auto; padding: 10px; }
  .user-session-item {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 4px;
  }
  .user-session-item:hover { background: rgba(255,255,255,0.1); }
  .user-session-item.active { background: rgba(255,255,255,0.15); }
  .user-session-title { font-size: 13px; color: white; margin-bottom: 4px; }
  .user-session-time { font-size: 11px; color: #818cf8; }
  .user-new-session-btn {
    margin: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .user-new-session-btn:hover { background: rgba(255,255,255,0.2); }
  .user-sidebar-footer {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-info .avatar {
    width: 36px; height: 36px;
    background: #4f46e5;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600;
  }
  .user-info .u-name { color: white; font-size: 13px; }
  .user-info .u-role { color: #818cf8; font-size: 11px; }
  .logout-btn {
    margin-top: 10px;
    padding: 8px;
    width: 100%;
    background: rgba(239,68,68,0.2);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 6px;
    color: #fca5a5;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .logout-btn:hover { background: rgba(239,68,68,0.3); }

  .user-chat-main { flex: 1; display: flex; flex-direction: column; background: #f5f7fb; }
  .user-chat-header {
    padding: 16px 24px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .user-chat-title { font-size: 16px; font-weight: 600; }
  .user-chat-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; }
  .user-chat-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #9ca3af;
  }
  .user-chat-status .dot.connected { background: #10b981; }
  .user-chat-status .dot.disconnected { background: #ef4444; }

  .user-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.agent { justify-content: flex-start; }
  .msg .bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .msg.user .bubble {
    background: #4f46e5;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble {
    background: white;
    color: #1f2937;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .msg.system { justify-content: center; }
  .msg.system .bubble {
    background: #f0f2ff;
    color: #4f46e5;
    text-align: center;
    max-width: 80%;
  }
  .msg .bubble .typing {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  .quick-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .quick-actions .qa-btn {
    padding: 6px 12px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    color: #4f46e5;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-actions .qa-btn:hover { background: #f0f2ff; border-color: #4f46e5; }

  .user-chat-input {
    padding: 16px 24px;
    background: white;
    border-top: 1px solid #e5e7eb;
  }
  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrapper textarea {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    resize: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    transition: border-color 0.2s;
  }
  .input-wrapper textarea:focus { border-color: #4f46e5; }
  .send-btn {
    padding: 12px 20px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .send-btn:hover { background: #3730a3; }
  .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  .intent-badge {
    display: inline-block;
    padding: 2px 8px;
    background: #e0e7ff;
    color: #4f46e5;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 8px;
  }
  .tool-call {
    margin-top: 8px;
    padding: 6px 10px;
    background: #f3f4f6;
    border-radius: 6px;
    font-size: 12px;
    color: #6b7280;
  }
  .tool-call .tool-name { color: #4f46e5; font-weight: 500; }
</style>
</head>
<body>
<div class="user-app">
  <aside class="user-sidebar">
    <div class="user-sidebar-header">
      <div class="logo">
        <span class="logo-icon">🤖</span>
        <span class="logo-text">智能客服</span>
      </div>
    </div>

    <button class="user-new-session-btn" id="newSessionBtn">+ 新对话</button>

    <div class="user-session-list" id="sessionList">
      <div class="user-session-item active" data-session="current">
        <div class="user-session-title">当前会话</div>
        <div class="user-session-time">刚刚</div>
      </div>
    </div>

    <div class="user-sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <div>
          <div class="u-name" id="username">用户</div>
          <div class="u-role">普通用户</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="user-chat-main">
    <div class="user-chat-header">
      <div class="user-chat-title">智能客服小助手</div>
      <div class="user-chat-status">
        <span class="dot" id="wsDot"></span>
        <span id="wsText">连接中...</span>
      </div>
    </div>

    <div class="user-chat-messages" id="chatMessages">
      <div class="msg system">
        <div class="bubble">
          <p>👋 你好！我是智能客服小助手，可以帮你处理：</p>
          <div class="quick-actions">
            <button class="qa-btn" data-msg="我的订单到哪了">📦 订单查询</button>
            <button class="qa-btn" data-msg="我要退货/退款">↩️ 退换货</button>
            <button class="qa-btn" data-msg="修改收货地址">✏️ 修改信息</button>
            <button class="qa-btn" data-msg="投诉">📢 投诉建议</button>
            <button class="qa-btn" data-msg="我要转人工客服">👤 转人工</button>
            <button class="qa-btn" data-msg="退换货政策是什么">❓ 政策咨询</button>
          </div>
        </div>
      </div>
    </div>

    <div class="user-chat-input">
      <div class="input-wrapper">
        <textarea id="chatInput" placeholder="请输入您的问题... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➤ 发送</button>
      </div>
    </div>
  </main>
</div>

<script>
const WS_URL = `ws://${window.location.host}/api/v1/chat/stream`;

const state = {
  userId: parseInt(localStorage.getItem('cs_user_id')) || 1,
  sessionId: null,
  ws: null,
  wsConnected: false,
  currentStreamEl: null,
  intent: null,
};

const $ = sel => document.querySelector(sel);

function updateWsStatus(status, text) {
  const dot = $('#wsDot');
  dot.className = 'dot';
  if (status === 'connected') { dot.classList.add('connected'); state.wsConnected = true; }
  else if (status === 'disconnected') { dot.classList.add('disconnected'); state.wsConnected = false; }
  $('#wsText').textContent = text;
}

function initWebSocket() {
  if (state.ws && state.ws.readyState <= 1) return;

  state.ws = new WebSocket(WS_URL);
  state.ws.onopen = () => updateWsStatus('connected', '在线');
  state.ws.onclose = () => {
    updateWsStatus('disconnected', '已断开');
    state.wsConnected = false;
    setTimeout(initWebSocket, 3000);
  };
  state.ws.onerror = () => updateWsStatus('disconnected', '连接错误');
  state.ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); }
    catch (err) { console.error('WS parse error:', err); }
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'stream_start':
      state.sessionId = data.session_id;
      state.currentStreamEl = addMessage('agent', '');
      break;
    case 'token':
      if (state.currentStreamEl) {
        state.currentStreamEl.querySelector('.bubble').textContent += data.content;
        scrollBottom();
      }
      break;
    case 'intent':
      state.intent = data.intent;
      showIntent(data.intent);
      break;
    case 'tool_call_start':
      showToolCall(data.tool);
      break;
    case 'tool_call_complete':
      hideToolCall();
      break;
    case 'done':
      if (state.currentStreamEl) {
        const content = state.currentStreamEl.querySelector('.bubble');
        content.textContent = data.reply || content.textContent;
        scrollBottom();
      }
      state.currentStreamEl = null;
      break;
    case 'stream_end':
      state.currentStreamEl = null;
      break;
    case 'error':
      if (state.currentStreamEl) {
        state.currentStreamEl.querySelector('.bubble').textContent = '❌ ' + (data.message || '未知错误');
      }
      state.currentStreamEl = null;
      break;
  }
}

function showIntent(intent) {
  const lastMsg = document.querySelectorAll('.msg.agent .bubble');
  if (!lastMsg.length) return;
  const last = lastMsg[lastMsg.length - 1];
  if (last.querySelector('.intent-badge')) return;
  const badge = document.createElement('span');
  badge.className = 'intent-badge';
  badge.textContent = intentMap[intent] || intent;
  last.appendChild(badge);
}

function showToolCall(name) {
  const lastBubble = document.querySelectorAll('.msg.agent .bubble');
  if (!lastBubble.length) return;
  const last = lastBubble[lastBubble.length - 1];
  const div = document.createElement('div');
  div.className = 'tool-call';
  div.id = 'currentToolCall';
  div.innerHTML = `<span>🔧 正在调用: <span class="tool-name">${toolNameMap[name] || name}</span></span>`;
  last.appendChild(div);
}

function hideToolCall() {
  const el = document.getElementById('currentToolCall');
  if (el) el.remove();
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  $('#chatMessages').appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  const container = $('#chatMessages');
  container.scrollTop = container.scrollHeight;
}

async function sendMessage(text) {
  if (!text.trim()) return;

  addMessage('user', text);

  if (!state.wsConnected) {
    const bubble = addMessage('agent', '正在连接服务，请稍候...');
    setTimeout(() => {
      bubble.querySelector('.bubble').textContent = '❌ 连接失败，请刷新页面重试';
    }, 2000);
    return;
  }

  state.ws.send(JSON.stringify({
    user_id: state.userId,
    message: text,
    session_id: state.sessionId,
  }));
}

function autoResize() {
  const input = $('#chatInput');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

const intentMap = {
  query_order: '订单查询', refund: '退换货', complaint: '投诉',
  technical: '技术咨询', promotion: '活动咨询', human: '转人工', general: '通用',
};

const toolNameMap = {
  query_order: '📦 订单查询',
  create_ticket: '📋 创建工单',
  apply_refund: '↩️ 申请退款',
  apply_exchange: '🔄 申请换货',
  update_address: '📍 更新地址',
  request_handoff: '👤 转人工',
  submit_complaint: '📢 提交投诉',
  search_knowledge: '🔍 知识库搜索',
};

function renderUserInfo(name) {
  $('#username').textContent = name;
  $('#userAvatar').textContent = name.charAt(0).toUpperCase();
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  const userName = localStorage.getItem('cs_user_name') || '用户';
  const userId = localStorage.getItem('cs_user_id');

  if (!userId) {
    // 尝试通过后端获取用户信息
    fetch('/api/v1/users/')
      .then(r => r.json())
      .then(data => {
        if (data && data.length > 0) {
          state.userId = data[0].id;
          localStorage.setItem('cs_user_id', String(data[0].id));
          renderUserInfo(data[0].username || userName);
        }
      })
      .catch(() => {
        localStorage.setItem('cs_user_id', '1');
        renderUserInfo(userName);
      });
  } else {
    state.userId = parseInt(userId) || 1;
    renderUserInfo(userName);
  }

  initWebSocket();

  $('#chatInput').addEventListener('input', autoResize);
  $('#chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(e.target.value);
      e.target.value = '';
      autoResize();
    }
  });

  $('#sendBtn').addEventListener('click', () => {
    const input = $('#chatInput');
    sendMessage(input.value);
    input.value = '';
    autoResize();
  });

  document.querySelectorAll('.qa-btn').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
  });

  $('#newSessionBtn').addEventListener('click', () => {
    state.sessionId = null;
    state.intent = null;
    $('#chatMessages').innerHTML = `
      <div class="msg system">
        <div class="bubble">
          <p>✨ 新对话开始，请问有什么可以帮您？</p>
          <div class="quick-actions">
            <button class="qa-btn" data-msg="我的订单到哪了">📦 订单查询</button>
            <button class="qa-btn" data-msg="我要退货/退款">↩️ 退换货</button>
            <button class="qa-btn" data-msg="修改收货地址">✏️ 修改信息</button>
            <button class="qa-btn" data-msg="投诉">📢 投诉建议</button>
            <button class="qa-btn" data-msg="我要转人工客服">👤 转人工</button>
            <button class="qa-btn" data-msg="退换货政策是什么">❓ 政策咨询</button>
          </div>
        </div>
      </div>
    `;
    document.querySelectorAll('.qa-btn').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });
  });

  $('#logoutBtn').addEventListener('click', () => {
    if (confirm('确定退出登录？')) {
      localStorage.removeItem('cs_user_role');
      localStorage.removeItem('cs_user_id');
      window.location.href = '/login.html';
    }
  });
});
</script>
</body>
</html>
